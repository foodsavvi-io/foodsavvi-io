<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>foodsavvi • inventory</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="shortcut icon" type="image/png" href="assets/icon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="backend.js"></script>
    <style>
        /* ... (same styles as before) ... */
        @font-face {
            font-family: 'RusticStory';
            src: url('./assets/RusticStory-R9vKM.ttf') format('truetype'),
                 url('./assets/RusticStory-1jDPL.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'RusticStory', sans-serif; }
        body { background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .app { width: 100%; max-width: 400px; background: white; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.03); position: relative; padding-bottom: 80px; }
        
        .header {
            padding: 20px 16px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .back-link {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #667eea;
            font-size: 20px;
            transition: 0.2s;
        }
        .back-link:active {
            background: #e8ecf0;
            transform: scale(0.95);
        }
        .header h1 { flex: 1; font-size: 20px; font-weight: 600; }
        .refresh-all-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #f5f7fa;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        .refresh-all-btn:active {
            transform: rotate(180deg);
        }
        
        .content { padding: 16px; }
        
        .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .control-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; transition: 0.2s; flex: 1; text-align: center; min-width: 60px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #34c759; color: white; }
        .btn-danger { background: #ff3b30; color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid #e0e0e0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        th { background: #f8f9fa; padding: 12px; text-align: left; border-bottom: 2px solid #e0e0e0; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .status-instock { background: #e8f5e8; color: #2e7d32; }
        .status-low { background: #fff3e0; color: #e65100; }
        .status-out { background: #ffebee; color: #c62828; }
        
        .action-btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; margin: 2px; }
        .action-edit { background: #e3f2fd; color: #0d47a1; }
        .action-ad { background: #ff9800; color: white; }
        .action-del { background: #ffebee; color: #c62828; }
        
        .readonly-badge {
            background: #f0f0f0;
            color: #666;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; border-radius: 16px; width: 100%; max-width: 350px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input[readonly] { background: #f5f5f5; color: #999; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 16px; }
        .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-top: 1px solid #f0f0f0;
            padding: 8px 20px;
            display: flex;
            justify-content: space-around;
            z-index: 50;
        }
        .nav-item {
            text-decoration: none;
            color: #999;
            font-size: 12px;
            text-align: center;
            flex: 1;
            padding: 4px 0;
        }
        .nav-item.active { color: #667eea; }
        .nav-emoji { font-size: 20px; display: block; margin-bottom: 2px; }
        
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .loading { text-align: center; padding: 20px; color: #999; }
        
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1a1a1a; color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 2000; pointer-events: none; white-space: nowrap; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .toast.success { background: #34c759; }
        .toast.error { background: #ff3b30; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <a href="#" id="backLink" class="back-link">←</a>
            <h1>inventory manager</h1>
            <button class="refresh-all-btn" onclick="loadInventory()">↻</button>
        </div>

        <div class="content">
            <!-- Controls – hidden for read-only users -->
            <div class="controls" id="controlsSection">
                <div class="control-row">
                    <button class="btn btn-success" id="addBtn" onclick="openCreateModal()">+ Add Item</button>
                    <button class="btn btn-secondary" onclick="exportExcel()">⬇ Export</button>
                    <button class="btn btn-secondary" id="importBtn" onclick="document.getElementById('excelInput').click()">⬆ Import</button>
                    <input type="file" id="excelInput" accept=".xlsx,.xls" style="display:none;" onchange="importExcel(event)">
                </div>
            </div>

            <!-- Read-only badge -->
            <div id="readonlyBadge" style="display:none; text-align:center; margin-bottom:12px;">
                <span class="readonly-badge">👁️ View Only</span>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Batch</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <tr><td colspan="6" class="loading">Loading inventory...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Bottom Nav -->
        <div class="bottom-nav" id="bottomNav">
            <a href="#" id="navHome" class="nav-item"><span class="nav-emoji">🏠</span><span>home</span></a>
            <a href="#" id="navAds" class="nav-item" style="display:none;"><span class="nav-emoji">📢</span><span>ads</span></a>
            <a href="inventory.html" id="navInventory" class="nav-item active"><span class="nav-emoji">📦</span><span>inventory</span></a>
            <a href="#" id="navSettings" class="nav-item"><span class="nav-emoji">⚙️</span><span>settings</span></a>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div class="modal" id="itemModal">
        <div class="modal-content">
            <h3 id="modalTitle">Add Inventory Item</h3>
            <input type="hidden" id="editId">
            
            <div class="form-group"><label>Item Name *</label><input type="text" id="fName" placeholder="e.g. Organic Milk"></div>
            <div class="form-group"><label>Batch Number</label><input type="text" id="fBatch" placeholder="BATCH-001"></div>
            <div class="form-group"><label>Quantity *</label><input type="number" id="fQty" value="1" min="0"></div>
            <div class="form-group"><label>Original Price ($)</label><input type="number" id="fPrice" step="0.01" placeholder="0.00"></div>
            
            <!-- Discount percentage toggle -->
            <div class="form-group">
                <label><input type="checkbox" id="fUseDiscount"> Apply discount %</label>
            </div>
            <div class="form-group" id="discountPctGroup" style="display:none;">
                <label>Discount %</label>
                <input type="number" id="fDiscountPct" step="0.1" min="0" max="100" placeholder="e.g. 20">
            </div>
            <div class="form-group">
                <label>Sale Price ($) <span id="salePriceNote" style="font-weight:400;color:#999;">(auto-calculated if using %)</span></label>
                <input type="number" id="fSale" step="0.01" placeholder="0.00">
            </div>
            
            <div class="form-group"><label>Category</label>
                <select id="fCat">
                    <option value="dairy">🥛 Dairy</option><option value="produce">🥬 Produce</option>
                    <option value="meat">🥩 Meat</option><option value="bakery">🥖 Bakery</option>
                    <option value="pantry">📦 Pantry</option><option value="frozen">❄️ Frozen</option>
                    <option value="other">📌 Other</option>
                </select>
            </div>
            <div class="form-group"><label><input type="checkbox" id="fOnSale"> On Sale</label></div>
            
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveItem()">Save</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentItems = [];
        let currentPermissions = {};
        let isOwner = false;
        let isEmployee = false;
        let businessId = null;
        let canEdit = false;
        let canRead = false;
        let canPostAds = false;
        let editingItemId = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            const user = Backend.getCurrentUser();
            const role = localStorage.getItem('userRole');
            if (!user || role !== 'advertiser') {
                window.location.href = 'login.html';
                return;
            }

            businessId = user.get('businessId') || user.id;
            currentPermissions = await Backend.getEmployeePermissions(user.id);
            
            if (currentPermissions.isOwner) {
                isOwner = true;
                canEdit = true;
                canRead = true;
                canPostAds = true;
            } else {
                isEmployee = true;
                canEdit = currentPermissions.can_edit_inventory || false;
                canRead = currentPermissions.can_read_inventory || false;
                canPostAds = currentPermissions.can_post_ads || false;
            }

            if (!canRead && !isOwner) {
                showToast('You do not have permission to view inventory', 'error');
                setTimeout(() => {
                    window.location.href = isEmployee ? 'employee-settings.html' : 'index.html';
                }, 1500);
                return;
            }

            setupUI();
            await loadInventory();

            // --- Discount percentage logic ---
            const useDiscountCheckbox = document.getElementById('fUseDiscount');
            const discountPctInput = document.getElementById('fDiscountPct');
            const salePriceInput = document.getElementById('fSale');
            const originalPriceInput = document.getElementById('fPrice');

            function updateSalePrice() {
                if (useDiscountCheckbox.checked) {
                    const orig = parseFloat(originalPriceInput.value) || 0;
                    const pct = parseFloat(discountPctInput.value) || 0;
                    if (orig > 0 && pct > 0) {
                        const sale = orig * (1 - pct / 100);
                        salePriceInput.value = sale.toFixed(2);
                    } else {
                        salePriceInput.value = '';
                    }
                    salePriceInput.readOnly = true;
                    salePriceInput.style.background = '#f5f5f5';
                } else {
                    salePriceInput.readOnly = false;
                    salePriceInput.style.background = 'white';
                }
            }

            useDiscountCheckbox.addEventListener('change', function() {
                const group = document.getElementById('discountPctGroup');
                if (this.checked) {
                    group.style.display = 'block';
                    // If original price exists, recalc
                    updateSalePrice();
                } else {
                    group.style.display = 'none';
                    salePriceInput.readOnly = false;
                    salePriceInput.style.background = 'white';
                }
            });

            discountPctInput.addEventListener('input', updateSalePrice);
            originalPriceInput.addEventListener('input', function() {
                if (useDiscountCheckbox.checked) updateSalePrice();
            });

            // Also when manually entering sale price, we could auto-calc discount? We'll keep it simple.
        });

        function setupUI() {
            const backLink = document.getElementById('backLink');
            if (isEmployee) {
                backLink.href = 'employee-settings.html';
            } else {
                backLink.href = 'index.html';
            }

            const navHome = document.getElementById('navHome');
            const navAds = document.getElementById('navAds');
            const navSettings = document.getElementById('navSettings');
            
            if (isEmployee) {
                navHome.href = 'index-employee.html';
                navSettings.href = 'business-profile.html';
                navAds.style.display = 'none';
            } else {
                navHome.href = 'index.html';
                navAds.href = 'advertise.html';
                navAds.style.display = 'block';
                navSettings.href = 'business-profile.html?tab=profile';
            }

            const controlsSection = document.getElementById('controlsSection');
            const readonlyBadge = document.getElementById('readonlyBadge');
            
            if (canEdit || isOwner) {
                controlsSection.style.display = 'block';
                readonlyBadge.style.display = 'none';
            } else {
                controlsSection.style.display = 'none';
                readonlyBadge.style.display = 'block';
            }
        }

        async function loadInventory() {
            const tbody = document.getElementById('inventoryTableBody');
            try {
                currentItems = await Backend.loadInventoryItems(businessId);
                
                if (currentItems.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No items found. ${canEdit || isOwner ? 'Add your first item!' : ''}</td></tr>`;
                    return;
                }

                const showAdExport = (canEdit || isOwner) && canPostAds;

                tbody.innerHTML = currentItems.map(item => {
                    const qty = item.quantity || 0;
                    let statusHtml = `<span class="status-badge status-instock">In Stock</span>`;
                    if (qty <= 0) statusHtml = `<span class="status-badge status-out">Sold Out</span>`;
                    else if (qty <= 5) statusHtml = `<span class="status-badge status-low">Low Stock</span>`;

                    let priceHtml = `$${item.originalPrice.toFixed(2)}`;
                    if (item.onSale && item.salePrice > 0) {
                        priceHtml = `<span style="text-decoration:line-through;color:#999;">$${item.originalPrice.toFixed(2)}</span> <span style="color:#34c759;">$${item.salePrice.toFixed(2)}</span>`;
                    }

                    let actionsHtml = '';
                    if (canEdit || isOwner) {
                        actionsHtml = `
                            <button class="action-btn action-edit" onclick="openEditModal('${item.id}')">✏️</button>
                            ${showAdExport && item.onSale && item.salePrice > 0 ? `<button class="action-btn action-ad" onclick="exportToAds('${item.id}')">📤</button>` : ''}
                            <button class="action-btn action-del" onclick="deleteItem('${item.id}')">🗑️</button>
                        `;
                    } else {
                        actionsHtml = `<span style="color:#999; font-size:11px;">—</span>`;
                    }

                    return `
                        <tr>
                            <td><strong>${escapeHtml(item.name)}</strong></td>
                            <td>${item.batchNumber || 'N/A'}</td>
                            <td>${qty}</td>
                            <td>${priceHtml}</td>
                            <td>${statusHtml}</td>
                            <td>${actionsHtml}</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state" style="color:#ff3b30;">Error loading data</td></tr>`;
            }
        }

        // --- Modal helpers ---
        function resetModal() {
            document.getElementById('editId').value = '';
            document.getElementById('fName').value = '';
            document.getElementById('fBatch').value = '';
            document.getElementById('fQty').value = 1;
            document.getElementById('fPrice').value = '';
            document.getElementById('fSale').value = '';
            document.getElementById('fCat').value = 'other';
            document.getElementById('fOnSale').checked = false;
            document.getElementById('fUseDiscount').checked = false;
            document.getElementById('fDiscountPct').value = '';
            document.getElementById('discountPctGroup').style.display = 'none';
            document.getElementById('fSale').readOnly = false;
            document.getElementById('fSale').style.background = 'white';
            editingItemId = null;
        }

        function openCreateModal() {
            if (!canEdit && !isOwner) { showToast('Read-only mode', 'error'); return; }
            document.getElementById('modalTitle').textContent = 'Add New Item';
            resetModal();
            document.getElementById('itemModal').style.display = 'flex';
        }

        function openEditModal(id) {
            if (!canEdit && !isOwner) { showToast('Read-only mode', 'error'); return; }
            const item = currentItems.find(i => i.id === id);
            if (!item) { showToast('Item not found', 'error'); return; }
            document.getElementById('modalTitle').textContent = 'Edit Item';
            document.getElementById('editId').value = id;
            document.getElementById('fName').value = item.name;
            document.getElementById('fBatch').value = item.batchNumber || '';
            document.getElementById('fQty').value = item.quantity;
            document.getElementById('fPrice').value = item.originalPrice;
            document.getElementById('fCat').value = item.category || 'other';
            document.getElementById('fOnSale').checked = item.onSale || false;
            editingItemId = id;

            // Handle discount percentage pre-fill
            if (item.onSale && item.salePrice > 0 && item.originalPrice > 0) {
                const discount = ((item.originalPrice - item.salePrice) / item.originalPrice) * 100;
                if (discount > 0 && discount < 100) {
                    document.getElementById('fUseDiscount').checked = true;
                    document.getElementById('fDiscountPct').value = discount.toFixed(1);
                    document.getElementById('discountPctGroup').style.display = 'block';
                    document.getElementById('fSale').value = item.salePrice;
                    document.getElementById('fSale').readOnly = true;
                    document.getElementById('fSale').style.background = '#f5f5f5';
                } else {
                    // Sale price not a discount, or edge case
                    document.getElementById('fUseDiscount').checked = false;
                    document.getElementById('discountPctGroup').style.display = 'none';
                    document.getElementById('fSale').value = item.salePrice;
                    document.getElementById('fSale').readOnly = false;
                    document.getElementById('fSale').style.background = 'white';
                }
            } else {
                // No sale price or not on sale
                document.getElementById('fUseDiscount').checked = false;
                document.getElementById('discountPctGroup').style.display = 'none';
                document.getElementById('fSale').value = item.salePrice || '';
                document.getElementById('fSale').readOnly = false;
                document.getElementById('fSale').style.background = 'white';
            }

            document.getElementById('itemModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('itemModal').style.display = 'none';
            resetModal();
        }

        async function saveItem() {
            if (!canEdit && !isOwner) { showToast('Read-only mode', 'error'); return; }
            const id = document.getElementById('editId').value;
            const name = document.getElementById('fName').value.trim();
            const batch = document.getElementById('fBatch').value.trim();
            const qty = parseInt(document.getElementById('fQty').value) || 0;
            const origPrice = parseFloat(document.getElementById('fPrice').value) || 0;
            const onSale = document.getElementById('fOnSale').checked;
            const useDiscount = document.getElementById('fUseDiscount').checked;
            let salePrice = parseFloat(document.getElementById('fSale').value) || 0;

            if (!name) { showToast('Item name is required', 'error'); return; }

            // If using discount, recalc sale price
            if (useDiscount) {
                const pct = parseFloat(document.getElementById('fDiscountPct').value) || 0;
                if (origPrice > 0 && pct > 0) {
                    salePrice = origPrice * (1 - pct / 100);
                } else {
                    showToast('Invalid discount percentage or original price', 'error');
                    return;
                }
            }

            const data = {
                name: name,
                batchNumber: batch,
                quantity: qty,
                originalPrice: origPrice,
                salePrice: salePrice,
                category: document.getElementById('fCat').value,
                onSale: onSale
            };

            try {
                if (id) {
                    const result = await Backend.updateInventoryItem(id, data);
                    if (result.success) { showToast('Item updated!', 'success'); } else { showToast('Update failed', 'error'); }
                } else {
                    let items = await Backend.loadInventoryItems(businessId);
                    items.push({
                        ...data,
                        businessId: businessId
                    });
                    const result = await Backend.saveInventoryItems(items);
                    if (result.success) { showToast('Item added!', 'success'); } else { showToast('Add failed', 'error'); }
                }
                closeModal();
                await loadInventory();
            } catch (e) {
                showToast('Error saving item', 'error');
                console.error(e);
            }
        }

        async function deleteItem(id) {
            if (!canEdit && !isOwner) { showToast('Read-only mode', 'error'); return; }
            if (!confirm('Delete this item permanently?')) return;
            const result = await Backend.deleteInventoryItem(id);
            if (result.success) { showToast('Item deleted', 'success'); await loadInventory(); } 
            else { showToast('Delete failed', 'error'); }
        }

        // --- Export to Ads (only if canEdit AND canPostAds AND item is onSale with salePrice) ---
        function exportToAds(id) {
            if (!canEdit || !canPostAds) {
                showToast('You do not have permission to export to ads', 'error');
                return;
            }
            const item = currentItems.find(i => i.id === id);
            if (!item) { showToast('Item not found', 'error'); return; }
            if (!item.onSale || item.salePrice <= 0) {
                showToast('This item is not on sale – cannot export to ads.', 'error');
                return;
            }
            let discount = 0;
            if (item.originalPrice > 0 && item.salePrice < item.originalPrice) {
                discount = Math.round(((item.originalPrice - item.salePrice) / item.originalPrice) * 100);
            } else {
                showToast('Sale price must be lower than original price to create a discount.', 'error');
                return;
            }

            const exportData = {
                name: item.name,
                price: item.originalPrice || 0,
                discount: discount,
                batch: item.batchNumber || '',
                category: item.category || 'other',
                inventoryId: item.id,
                expiryDate: item.expiryDate || null,
                quantity: item.quantity || 0,
                description: ''
            };
            
            localStorage.setItem('inventoryExportData', JSON.stringify(exportData));
            showToast('Exporting to Ads...', 'success');
            setTimeout(() => {
                window.location.href = 'advertise.html?fromInventory=true';
            }, 500);
        }

        // --- Excel Export ---
        function exportExcel() {
            if (currentItems.length === 0) { showToast('No data to export', 'error'); return; }
            const exportData = currentItems.map(item => ({
                'Item Name': item.name,
                'Batch Number': item.batchNumber || '',
                'Expiry Date': item.expiryDate || '',
                'Quantity': item.quantity || 0,
                'Original Price': item.originalPrice || 0,
                'Sale Price': item.salePrice || 0,
                'Category': item.category || '',
                'On Sale': item.onSale ? 'Yes' : 'No'
            }));
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(exportData);
            XLSX.utils.book_append_sheet(wb, ws, 'Inventory');
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `inventory_${new Date().toISOString().split('T')[0]}.xlsx`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            showToast('Exported successfully!', 'success');
        }

        // --- Excel Import ---
        async function importExcel(event) {
            if (!canEdit && !isOwner) { showToast('Read-only mode - cannot import', 'error'); return; }
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    
                    const newItems = jsonData.map(row => ({
                        name: row['Item Name'] || row['name'] || '',
                        batchNumber: row['Batch Number'] || row['batchNumber'] || '',
                        expiryDate: row['Expiry Date'] || row['expiryDate'] || null,
                        quantity: parseInt(row['Quantity'] || row['quantity'] || 0) || 0,
                        originalPrice: parseFloat(row['Original Price'] || row['originalPrice'] || 0) || 0,
                        salePrice: parseFloat(row['Sale Price'] || row['salePrice'] || 0) || 0,
                        category: row['Category'] || row['category'] || 'other',
                        onSale: (row['On Sale'] || row['onSale'] || '').toString().toLowerCase() === 'yes',
                        businessId: businessId
                    })).filter(item => item.name.trim() !== '');

                    if (newItems.length === 0) { showToast('No valid items found', 'error'); return; }
                    
                    const existing = await Backend.loadInventoryItems(businessId);
                    const merged = [...existing, ...newItems];
                    const result = await Backend.saveInventoryItems(merged);
                    if (result.success) {
                        showToast(`Imported ${newItems.length} items!`, 'success');
                        await loadInventory();
                    } else {
                        showToast('Import failed', 'error');
                    }
                } catch (err) { showToast('Error parsing file', 'error'); }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        // --- Toast Helper ---
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast show ${type}`;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.classList.remove('show'); }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }
    </script>
</body>
